<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
            overflow: hidden;
            background: #000;
        }

        /* Background */
        .background {
            position: fixed;
            inset: 0;
            background-image: url("login-bg.png");
            background-position: center;
            background-size: cover;
            background-repeat: no-repeat;
            z-index: -2;
        }

        /* Membuat background sedikit lebih gelap */
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.18);
            z-index: -1;
        }

        /* Container utama */
        .login-wrapper {
            width: 100%;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;
        }

        /* Kotak login */
        .login-box {
            width: 420px;
            min-height: 500px;

            background: #292b32;

            padding: 44px 34px 38px;

            color: white;

            box-shadow:
                0 10px 35px rgba(0, 0, 0, 0.45);
        }

        /* Judul */
        .login-title {
            text-align: center;
            font-size: 29px;
            font-weight: 700;
            margin-bottom: 21px;
        }

        /* Form */
        .login-form {
            width: 100%;
        }

        .input {
            width: 100%;
            height: 37px;

            background: #34363e;
            border: 1px solid #777a82;
            border-radius: 8px;

            color: white;

            padding: 0 16px;

            font-size: 14px;

            outline: none;

            margin-bottom: 10px;

            transition: 0.2s;
        }

        .input::placeholder {
            color: #eeeeee;
            opacity: 1;
        }

        .input:focus {
            border-color: #ffffff;
        }

        /* Tombol */
        .btn {
            width: 100%;
            height: 37px;

            border-radius: 8px;

            border: 1px solid #aaaeb7;

            background: #34363e;

            color: white;

            font-size: 14px;

            cursor: pointer;

            transition: background 0.2s, transform 0.1s;
        }

        .btn:hover {
            background: #40434c;
        }

        .btn:active {
            transform: scale(0.99);
        }

        /* Link lupa password */
        .forgot {
            display: block;

            text-align: center;

            color: white;

            font-size: 14px;

            text-decoration: none;

            margin: 28px 0 18px;
        }

        .forgot:hover {
            text-decoration: underline;
        }

        /* Garis */
        .divider {
            width: 100%;
            height: 1px;
            background: #9a9ca2;

            margin-bottom: 30px;
        }

        /* Tombol kode */
        .code-button {
            margin-bottom: 11px;
        }

        /* Daftar */
        .register {
            display: block;

            text-align: center;

            color: white;

            font-size: 14px;

            font-weight: 700;

            text-decoration: none;

            margin-top: 32px;
        }

        .register:hover {
            text-decoration: underline;
        }


        /* Responsive */
        @media (max-width: 600px) {

            .login-box {
                width: 100%;
                max-width: 420px;

                padding: 35px 25px;
            }

            .login-title {
                font-size: 25px;
            }

        }

        @media (max-height: 650px) {

            .login-box {
                transform: scale(0.9);
            }

        }
    </style>
</head>

<body>

    <!-- Background gambar -->
    <div class="background"></div>
    <div class="overlay"></div>


    <!-- Login -->
    <main class="login-wrapper">

        <section class="login-box">

            <h1 class="login-title">
                Log in ke Roblox
            </h1>

            <form
                class="login-form"
                onsubmit="return false;"
            >

                <input
                    class="input"
                    type="text"
                    placeholder="Nama Pengguna/Email/Nomor Ponsel"
                    autocomplete="off"
                >

                <input
                    class="input"
                    type="password"
                    placeholder="Password"
                    autocomplete="off"
                >

                <button class="btn" type="button">
                    Log In
                </button>

            </form>


            <a href="#" class="forgot">
                Lupa Password atau Nama Pengguna?
            </a>


            <div class="divider"></div>


            <button class="btn code-button" type="button">
                Kirimi Saya Kode Sekali Pakai
            </button>

            <button class="btn" type="button">
                Log In Cepat
            </button>


            <a href="#" class="register">
                Tidak punya akun? Daftar
            </a>

        </section>

    </main>

</body>
</html>
